<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Football Scores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e14;
    --surface: #11161f;
    --surface-raised: #161d29;
    --line: rgba(255,255,255,0.07);
    --text: #f4f6f9;
    --text-mid: #9aa4b5;
    --text-dim: #5c6577;
    --live: #ffb020;
    --final: #5c6577;
    --chrome: #4b4f52;
    --chrome-font: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --display-font: 'Oswald', 'Arial Narrow', sans-serif;
    --mono-font: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  }

  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }

  /* Fixed 720x1280 reference canvas, scaled as one unit to fit the window.
     At 1080x1920 the scale is exactly 1.5. */
  #stage {
    position: fixed;
    top: 0;
    left: 0;
    width: 720px;
    height: 1280px;
    transform-origin: 0 0;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
  }

  /* ---------- Chrome (header / footer) ---------- */
  .bar {
    flex: none;
    background: var(--chrome);
    font-family: var(--chrome-font);
    font-size: 62px;
    font-weight: 700;
    line-height: 1;
    box-sizing: border-box;
    height: 112px;
    padding: 0 29px;
    display: flex;
    align-items: center;
    white-space: nowrap;
    letter-spacing: 0.01em;
  }
  header.bar, footer.bar { justify-content: space-between; }
  /* Train bar on top, weather/clock bar on the bottom, each with a thin
     white line along the edge that faces the game card. */
  header.bar {
    background: #62361b;  /* CTA Brown Line */
    border-bottom: 4px solid #fff;
  }
  footer.bar { border-top: 4px solid #fff; }
  #clock, #temp, #trains { font-variant-numeric: tabular-nums; }
  .weather {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .weather svg {
    width: 70px;
    height: 70px;
    flex: none;
  }
  /* Schedule-based prediction (train isn't reporting its live location). */
  .train-sched { color: #a9a9a9; }
  .train-unit {
    font-size: 50px;
    font-weight: 500;
    opacity: 0.85;
  }

  /* ---------- Content zone ---------- */
  main {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 29px;
    background: radial-gradient(circle at 50% 0%, #131a26 0%, var(--bg) 60%);
  }

  .card {
    position: relative;
    box-sizing: border-box;
    width: 100%;
    height: 100%;
    background: var(--surface);
    border-radius: 16px;
    padding: 39px 29px 33px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-evenly;
    overflow: hidden;
    transition: opacity 280ms ease;
  }
  .card.out { opacity: 0; }

  .team {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    width: 100%;
  }

  .name-row {
    width: 100%;
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 12px;
    white-space: nowrap;
    font-family: var(--display-font);
    line-height: 1.15;
  }
  .rank {
    font-size: 58px;
    font-weight: 700;
    color: var(--live);
  }
  .name {
    font-size: 76px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.01em;
  }

  /* Score and logo share a fixed-height slot so states never shift layout. */
  .mark {
    height: 200px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .score {
    font-family: var(--mono-font);
    font-size: 190px;
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.03em;
  }
  .logo {
    width: 170px;
    height: 170px;
    object-fit: contain;
  }

  .accent {
    width: 190px;
    height: 10px;
    border-radius: 5px;
    background: var(--text-mid);
  }

  .status {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    /* Fixed height so the teams never shift between game states. */
    height: 160px;
  }
  .status-main {
    display: flex;
    align-items: center;
    gap: 16px;
    font-family: var(--display-font);
    font-size: 76px;
    font-weight: 700;
    line-height: 1.3;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .dot {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--live);
    box-shadow: 0 0 12px 2px rgba(255,176,32,0.55);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  .state-live .status-main { color: var(--live); }
  .state-post .status-main { color: var(--final); }
  .state-pre  .status-main { color: var(--text); }

  /* Final: losing side's label + bar go dim, its number only to --text-mid. */
  .team.loser .name { color: var(--text-dim); }
  .team.loser .score { color: var(--text-mid); }
  .team.loser .accent { background: var(--text-dim) !important; }

  /* Pulsing football to the right of the team with the ball. It's positioned
     off the name so the name itself stays centered. */
  .name { position: relative; }
  .ball {
    position: absolute;
    left: calc(100% + 18px);
    top: 50%;
    width: 80px;
    height: 50px;
    margin-top: -25px;
    color: var(--live);
    filter: drop-shadow(0 0 6px rgba(255,176,32,0.55));
    animation: pulse 1.6s ease-in-out infinite;
  }

  /* 6-second dwell indicator along the bottom edge of the card. */
  .progress {
    position: absolute;
    left: 0;
    bottom: 0;
    height: 4px;
    width: 100%;
    background: rgba(255,255,255,0.14);
    transform-origin: 0 50%;
    transform: scaleX(0);
  }
  .progress.run {
    transform: scaleX(1);
    transition: transform linear;
  }

  .league-logo {
    width: 560px;
    height: 720px;
    object-fit: contain;
    filter: brightness(0.7);
  }
  /* NFL shield shown 30% smaller than the full-size logo box. */
  .league-logo.small {
    width: 392px;
    height: 504px;
  }

  .message {
    font-family: var(--display-font);
    font-size: 76px;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--text-mid);
    text-align: center;
  }
</style>
</head>
<body>
<div id="stage">
  <header class="bar">
    <span>Loop</span>
    <span id="trains">&ndash;</span>
  </header>
  <main>
    <div class="card" id="card">
      <div class="message">Loading scores</div>
    </div>
  </main>
  <footer class="bar">
    <span class="weather"><svg id="wx-icon" viewBox="0 0 64 64" aria-hidden="true"></svg><span id="temp">&ndash;&deg;</span></span>
    <span id="clock"></span>
  </footer>
</div>

  const LEAGUES = {
    cfb: {
      api: ESPN + 'college-football/scoreboard?limit=300' + (GROUPS ? '&groups=' + encodeURIComponent(GROUPS) : ''),
      logo: NCAA_LOGO,
      logoPath: t => `ncaa/500-dark/${t.id}`,
      name: t => t.location,
      ranked: true,
      // Only games with a Top 25 team, plus these teams every week
      // (ESPN team IDs: 57 = Florida, 130 = Michigan). ?all=1 shows every FBS game.
      // Always: games with a Top 25 team, plus Florida and Michigan
      // (ESPN team IDs 57 and 130). While live: also any Big Ten or SEC game
      // (ESPN conference IDs 5 and 8). ?all=1 shows every FBS game.
      keep: params.get('all') ? null
        : g => [g.away, g.home].some(t => t.rank || ['57', '130'].includes(t.id)
          || (g.state === 'in' && ['5', '8'].includes(t.conf))),
    },
    nfl: {
      api: ESPN + 'nfl/scoreboard',
      logo: NFL_LOGO,
      logoSmall: true,
      logoPath: t => `nfl/500-dark/${(t.abbreviation || '').toLowerCase()}`,
      name: t => t.name,
      ranked: false,
    },
  };
  // NFL on Thursdays, Sundays and Mondays (Chicago time); college football
  // Tuesday, Wednesday, Friday and Saturday.
  // ?league=nfl or ?league=cfb forces one.
  function leagueForToday() {
    const forced = params.get('league');
    if (LEAGUES[forced]) return forced;
    const day = new Date().toLocaleDateString('en-US', { weekday: 'short', timeZone: TZ });
    return ['Thu', 'Sun', 'Mon'].includes(day) ? 'nfl' : 'cfb';
  }

  const stage = document.getElementById('stage');
  const card = document.getElementById('card');
  const trains = document.getElementById('trains');
  const wxIcon = document.getElementById('wx-icon');
  const temp = document.getElementById('temp');
  // Clock, kickoff times and weather are all for Chicago.
  const TZ = 'America/Chicago';
  const clock = document.getElementById('clock');

  // ---------- Canvas scaling ----------
  // Measure the root element, not innerWidth: some browsers/emulators grow
  // innerWidth to include the unscaled 720px canvas before we shrink it.
  function fit() {
    const w = document.documentElement.clientWidth;
    const h = document.documentElement.clientHeight;
    const s = Math.min(w / 720, h / 1280);
    const x = (w - 720 * s) / 2;
    const y = (h - 1280 * s) / 2;
    stage.style.transform = `translate(${x}px, ${y}px) scale(${s})`;
  }
  addEventListener('resize', fit);
  fit();

  // ---------- Clock ----------
  function tickClock() {
    clock.textContent = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', timeZone: TZ });
  }
  setInterval(tickClock, 1000);
  tickClock();

  // ---------- Data ----------
  let games = [];
  let lastGood = 0;
  let activeLeague = LEAGUES.cfb;

  async function load() {
    try {
      const L = LEAGUES[leagueForToday()];
      const res = await fetch(L.api, { cache: 'no-store' });
      if (!res.ok) throw new Error(res.status);
      const data = await res.json();
      games = (data.events || []).map(ev => parseEvent(ev, L)).filter(Boolean)
        .filter(g => !L.keep || L.keep(g));
      activeLeague = L;
      lastGood = Date.now();
    } catch (err) {
      console.warn('Score fetch failed; keeping last data', err);
    }
    const anyLive = games.some(g => g.state === 'in');
    setTimeout(load, anyLive ? 15000 : 60000);
  }

  function parseEvent(ev, L) {
    const comp = ev.competitions && ev.competitions[0];
    if (!comp) return null;
    const side = ha => {
      const c = comp.competitors.find(t => t.homeAway === ha);
      const t = c.team || {};
      const rank = c.curatedRank && c.curatedRank.current;
      return {
        id: t.id,
        name: L.name(t) || t.shortDisplayName || t.displayName || t.abbreviation,
        abbr: t.abbreviation || '',
        conf: t.conferenceId,
        rank: L.ranked && rank && rank <= 25 ? rank : null,
        score: c.score,
        winner: !!c.winner,
        color: pickColor(t.color, t.alternateColor),
        logo: t.id ? `https://a.espncdn.com/i/teamlogos/${L.logoPath(t)}.png` : t.logo,
        logoFallback: t.logo,
      };
    };
    const st = ev.status || {};
    const type = st.type || {};
    return {
      id: ev.id,
      date: new Date(ev.date),
      timeValid: comp.timeValid !== false,
      state: type.state,              // pre | in | post
      statusName: type.name,
      shortDetail: type.shortDetail || '',
      period: st.period,
      clock: st.displayClock,
      situation: comp.situation || null,
      away: side('away'),
      home: side('home'),
    };
  }

  // Team colors come from ESPN; skip ones too dark to see on the card.
  function pickColor(...hexes) {
    for (const h of hexes) {
      if (!h || !/^[0-9a-f]{6}$/i.test(h)) continue;
      const [r, g, b] = [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16) / 255);
      const lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
      if (lum > 0.12) return '#' + h;
    }
    return 'var(--text-mid)';
  }

  // Live games first, then upcoming by kickoff, then most recent finals.
  // Optional ?only=live,upcoming,final to limit which games rotate.
  const ONLY = params.get('only') && params.get('only').split(',')
    .map(s => ({ live: 'in', upcoming: 'pre', final: 'post' }[s.trim()])).filter(Boolean);

  function ordered() {
    const rank = { in: 0, pre: 1, post: 2 };
    return games.filter(g => !ONLY || !ONLY.length || ONLY.includes(g.state)).sort((a, b) => {
      const r = (rank[a.state] ?? 1) - (rank[b.state] ?? 1);
      if (r) return r;
      return a.state === 'post' ? b.date - a.date : a.date - b.date;
    });
  }

  // ---------- Rendering ----------
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function periodLabel(p) {
    if (p <= 4) return 'Q' + p;
    return (p === 5 ? '' : (p - 4)) + 'OT';
  }

  function statusFor(g) {
    if (g.state === 'in') {
      let main;
      if (g.statusName === 'STATUS_HALFTIME') main = 'Halftime';
      else if (g.statusName === 'STATUS_END_PERIOD') main = 'End ' + periodLabel(g.period);
      else main = `${periodLabel(g.period)} ${g.clock}`;
      return { main, dot: true };
    }
    if (g.state === 'post') {
      const d = g.shortDetail.toUpperCase();
      return { main: d.startsWith('FINAL') ? d : (d || 'FINAL') };
    }
    // pre-game (also postponed / canceled, which ESPN reports as "pre" or "post")
    if (g.statusName && !/SCHEDULED/.test(g.statusName)) {
      return { main: g.shortDetail || 'TBD' };
    }
    // Games later today show just the time; other days get the weekday too.
    const ymd = d => d.toLocaleDateString('en-CA', { timeZone: TZ });
    const isToday = ymd(g.date) === ymd(new Date());
    const day = isToday ? 'Today' : g.date.toLocaleDateString([], { weekday: 'short', timeZone: TZ });
    if (!g.timeValid) return { main: `${day} TBD` };
    const time = g.date.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', timeZone: TZ });
    return { main: isToday ? time : `${day} ${time}` };
  }

  const BALL_SVG = '<svg class="ball" viewBox="0 0 64 40" aria-hidden="true">'
    + '<path fill="currentColor" d="M3 20C13 1 51 1 61 20C51 39 13 39 3 20Z"/>'
    + '<g stroke="var(--surface)" stroke-width="3" stroke-linecap="round">'
    + '<line x1="21" y1="20" x2="43" y2="20"/>'
    + '<line x1="25" y1="15" x2="25" y2="25"/><line x1="30" y1="15" x2="30" y2="25"/>'
    + '<line x1="35" y1="15" x2="35" y2="25"/><line x1="40" y1="15" x2="40" y2="25"/>'
    + '<path fill="none" d="M11 11C9 16 9 24 11 29M53 11C55 16 55 24 53 29"/></g></svg>';

  function teamHTML(t, g, bottom) {
    const showScore = g.state !== 'pre' && t.score != null && t.score !== '';
    const loser = g.state === 'post' && !t.winner && (g.away.winner || g.home.winner);
    const hasPoss = g.state === 'in' && g.statusName !== 'STATUS_HALFTIME'
      && g.situation && g.situation.possession === t.id;
    const name = `<div class="name-row">${t.rank ? `<span class="rank">${t.rank}</span>` : ''}<span class="name">${esc(t.name)}${hasPoss ? BALL_SVG : ''}</span></div>`;
    const mark = `<div class="mark">${showScore
      ? `<span class="score">${esc(t.score)}</span>`
      : `<img class="logo" alt="" src="${esc(t.logo)}" data-fallback="${esc(t.logoFallback)}">`}</div>`;
    const accent = `<div class="accent" style="background:${t.color}"></div>`;
    const parts = bottom ? [accent, mark, name] : [name, mark, accent];
    return `<div class="team${loser ? ' loser' : ''}">${parts.join('')}</div>`;
  }

  function render(g) {
    const s = statusFor(g);
    card.className = 'card state-' + (g.state || 'pre');
    card.innerHTML =
      teamHTML(g.away, g, false) +
      `<div class="status">
         <div class="status-main">${s.dot ? '<span class="dot"></span>' : ''}<span>${esc(s.main)}</span></div>
       </div>` +
      teamHTML(g.home, g, true) +
      '<div class="progress"></div>';

    card.querySelectorAll('img.logo').forEach(img => {
      img.onerror = () => {
        const fb = img.dataset.fallback;
        if (fb && img.src !== fb) img.src = fb; else img.style.visibility = 'hidden';
      };
    });
    fitText(card.querySelectorAll('.name-row'), 76, '.name');
    fitText(card.querySelectorAll('.status-main'), 76);

    startProgress();
  }

  function startProgress() {
    const bar = card.querySelector('.progress');
    bar.style.transitionDuration = DWELL_MS + 'ms';
    requestAnimationFrame(() => requestAnimationFrame(() => bar.classList.add('run')));
  }

  // Shrink long team names / status text until they fit the card width.
  function fitText(els, base, sel) {
    const max = card.clientWidth - 58;
    els.forEach(el => {
      const target = sel ? el.querySelector(sel) : el;
      let size = base;
      target.style.fontSize = size + 'px';
      while (el.scrollWidth > max && size > base * 0.55) {
        size -= 2;
        target.style.fontSize = size + 'px';
      }
    });
  }

  function preload(g) {
    if (!g || g.state !== 'pre') return;
    [g.away, g.home].forEach(t => { const i = new Image(); i.src = t.logo; });
  }

  // ---------- Rotation ----------
  let currentId = null;
  const LOGO_SLIDE = { id: 'league-logo' };

  function renderLogo() {
    card.className = 'card';
    card.innerHTML = `<img class="league-logo${activeLeague.logoSmall ? ' small' : ''}" alt="" src="${activeLeague.logo}"><div class="progress"></div>`;
    startProgress();
  }

  function next() {
    const list = ordered();
    if (!list.length) {
      card.className = 'card';
      card.innerHTML = `<div class="message">${lastGood ? 'No games this week' : 'Loading scores'}</div>`;
      setTimeout(next, lastGood ? DWELL_MS : 1000);
      return;
    }
    // Each loop opens with the league logo slide, then the games.
    const seq = [LOGO_SLIDE, ...list];
    const idx = seq.findIndex(g => g.id === currentId);
    const i = (idx + 1) % seq.length;
    const g = seq[i];
    const swap = () => {
      currentId = g.id;
      if (g === LOGO_SLIDE) renderLogo(); else render(g);
      card.classList.remove('out');
      preload(seq[(i + 1) % seq.length]);
    };
    if (card.querySelector('.team, .league-logo')) {
      card.classList.add('out');
      setTimeout(swap, 280);
    } else {
      swap();
    }
    setTimeout(next, DWELL_MS);
  }

  // ---------- Next Brown Line train, Addison -> Loop ----------
  // Fetched through /api/cta (a Vercel function) so the CTA API key stays
  // private and the browser isn't blocked by the CTA API's missing CORS headers.
  let lastTrain = 0;

  async function loadTrain() {
    try {
      const res = await fetch('/api/cta', { cache: 'no-store' });
      if (!res.ok) throw new Error(res.status);
      const { arrivals } = await res.json();
      // Up to two trains that are reporting a live location, e.g. "DUE, 11 min".
      // If none are, fall back to the next scheduled departure, shown in grey.
      const live = (arrivals || []).filter(a => !a.scheduled);
      const shown = live.length ? live.slice(0, 2) : (arrivals || []).slice(0, 1);
      const parts = shown.map(a => {
        const text = a.approaching || a.minutes <= 1 ? 'DUE'
          : `${a.minutes}<span class="train-unit">\u2009min</span>`;
        return a.scheduled ? `<span class="train-sched">${text}</span>` : text;
      });
      trains.innerHTML = parts.length ? parts.join(',\u2002') : '\u2013';
      lastTrain = Date.now();
    } catch (err) {
      console.warn('Train fetch failed', err);
      // Don't leave an old arrival time up for long.
      if (Date.now() - lastTrain > 2 * 60 * 1000) trains.textContent = '\u2013';
    }
    setTimeout(loadTrain, 20000);
  }
  loadTrain();

  // ---------- Chicago weather (Open-Meteo, no API key) ----------
  const WX_API = 'https://api.open-meteo.com/v1/forecast?latitude=41.8781&longitude=-87.6298'
    + '&current=temperature_2m,weather_code,is_day&temperature_unit=fahrenheit&timezone=America%2FChicago';

  // Icons are drawn in currentColor, so they match the temperature text.
  const SUN = 'currentColor', CLOUD = 'currentColor', DARK_CLOUD = 'currentColor', RAIN = 'currentColor', MOON = 'currentColor';

  function sunSVG(cx, cy, r) {
    let rays = '';
    for (let k = 0; k < 8; k++) {
      const a = k * Math.PI / 4;
      const x1 = cx + Math.cos(a) * (r + 5), y1 = cy + Math.sin(a) * (r + 5);
      const x2 = cx + Math.cos(a) * (r + 10), y2 = cy + Math.sin(a) * (r + 10);
      rays += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`;
    }
    return `<g stroke="${SUN}" stroke-width="4" stroke-linecap="round">${rays}</g><circle cx="${cx}" cy="${cy}" r="${r}" fill="${SUN}"/>`;
  }
  // Crescent: a full disc with an offset disc masked out of it.
  const moonSVG = (cx, cy, r) =>
    `<mask id="moon-cut"><rect width="64" height="64" fill="#fff"/><circle cx="${cx + r * 0.55}" cy="${cy - r * 0.35}" r="${r * 0.85}" fill="#000"/></mask>`
    + `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${MOON}" mask="url(#moon-cut)"/>`;
  const CLOUD_SHAPES = '<circle cx="23" cy="37" r="10"/><circle cx="35" cy="30" r="13"/><circle cx="46" cy="38" r="9"/><rect x="13" y="36" width="42" height="14" rx="7"/>';
  // With one color, a cloud in front of the sun/moon needs a bar-colored
  // outline to separate the two shapes.
  const cloudSVG = (dy, fill, outline) =>
    `<g transform="translate(0 ${dy})">`
    + (outline ? `<g fill="var(--chrome)" stroke="var(--chrome)" stroke-width="7">${CLOUD_SHAPES}</g>` : '')
    + `<g fill="${fill}">${CLOUD_SHAPES}</g></g>`;

  function weatherIcon(code, isDay) {
    const sky = isDay ? sunSVG(32, 32, 12) : moonSVG(30, 34, 22);
    const smallSky = isDay ? sunSVG(22, 22, 8) : moonSVG(20, 22, 13);
    if (code === 0) return sky;
    if (code <= 2) return smallSky + cloudSVG(6, CLOUD, true);
    if (code === 3) return cloudSVG(0, CLOUD);
    if (code === 45 || code === 48) {
      return `<g stroke="${DARK_CLOUD}" stroke-width="5" stroke-linecap="round">`
        + '<line x1="12" y1="22" x2="52" y2="22"/><line x1="8" y1="32" x2="48" y2="32"/>'
        + '<line x1="16" y1="42" x2="56" y2="42"/><line x1="12" y1="52" x2="44" y2="52"/></g>';
    }
    if (code >= 95) {
      return cloudSVG(-8, DARK_CLOUD) + `<path fill="${SUN}" d="M35 46 L26 56 H32 L29 64 L40 52 H34 L37 46z"/>`;
    }
    if ((code >= 71 && code <= 77) || code === 85 || code === 86) {
      return cloudSVG(-8, CLOUD) + `<g fill="#ffffff"><circle cx="22" cy="52" r="3.5"/><circle cx="33" cy="58" r="3.5"/><circle cx="44" cy="52" r="3.5"/></g>`;
    }
    // Drizzle, rain, freezing rain and showers.
    return cloudSVG(-8, DARK_CLOUD)
      + `<g stroke="${RAIN}" stroke-width="4" stroke-linecap="round"><line x1="24" y1="48" x2="20" y2="58"/><line x1="34" y1="48" x2="30" y2="58"/><line x1="44" y1="48" x2="40" y2="58"/></g>`;
  }

  async function loadWeather() {
    try {
      const res = await fetch(WX_API, { cache: 'no-store' });
      if (!res.ok) throw new Error(res.status);
      const cur = (await res.json()).current;
      temp.textContent = Math.round(cur.temperature_2m) + '°';
      wxIcon.innerHTML = weatherIcon(cur.weather_code, cur.is_day === 1);
    } catch (err) {
      console.warn('Weather fetch failed; keeping last reading', err);
    }
    setTimeout(loadWeather, 10 * 60 * 1000);
  }
  loadWeather();

  load().then(next);
})();
</script>
</body>
</html>
